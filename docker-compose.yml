services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jalajogja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-jalajogja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jalajogja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?err}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── GOWA — WhatsApp Gateway ──────────────────────────────────────────────────
  # Satu instance untuk semua tenant — isolasi via device_id = slug per tenant
  # RAM: ~50MB base + ~10-30MB per tenant yang aktif terhubung
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    restart: unless-stopped
    ports:
      - "3002:3000"   # host:container — 3002 agar tidak clash dengan Next.js (3000)
    volumes:
      - gowa_data:/app/storages   # sesi WA persisten; tidak perlu scan ulang setelah restart
    environment:
      - BASIC_AUTH_CREDENTIAL=${WHATSAPP_API_USER:?err}:${WHATSAPP_API_PASS:?err}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js App ──────────────────────────────────────────────────────────────
  # Catatan: production dijalankan via PM2 (bukan container ini).
  # Container ini untuk keperluan testing Docker mode saja.
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jalajogja}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jalajogja}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?err}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?err}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?err}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?err}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?err}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?err}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?err}
      RAJAONGKIR_PLATFORM_KEY: ${RAJAONGKIR_PLATFORM_KEY:-}
      RAJAONGKIR_PLATFORM_TIER: ${RAJAONGKIR_PLATFORM_TIER:-starter}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # WhatsApp Gateway — untuk Docker mode (PM2 pakai localhost:3002)
      WHATSAPP_SERVICE_URL: http://gowa:3000
      WHATSAPP_API_USER: ${WHATSAPP_API_USER:-}
      WHATSAPP_API_PASS: ${WHATSAPP_API_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      gowa:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  gowa_data:    # sesi WhatsApp semua tenant — backup rutin disarankan
