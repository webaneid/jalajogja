services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jalajogja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-jalajogja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jalajogja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?err}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Next.js App ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jalajogja}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jalajogja}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?err}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?err}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?err}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?err}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?err}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?err}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?err}
      RAJAONGKIR_PLATFORM_KEY: ${RAJAONGKIR_PLATFORM_KEY:-}
      RAJAONGKIR_PLATFORM_TIER: ${RAJAONGKIR_PLATFORM_TIER:-starter}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
