# ──────────────────────────────────────────────────────────────────────────────
# Nginx config untuk jalakarta.com + custom domain tenant
# Taruh di: /etc/nginx/sites-available/jalakarta.com
# Aktifkan: ln -s /etc/nginx/sites-available/jalakarta.com /etc/nginx/sites-enabled/
#
# Asumsi:
#   - SSL jalakarta.com via Certbot (Let's Encrypt)
#   - SSL custom domain tenant via Cloudflare proxy (SSL di Cloudflare, ke VPS via HTTP)
#   - App berjalan di localhost:3000 (PM2)
#   - MinIO berjalan di localhost:9000
# ──────────────────────────────────────────────────────────────────────────────

# ── Catch-all untuk custom domain tenant (via Cloudflare proxy) ───────────────
# Custom domain: ikpmjogja.com → Cloudflare (SSL) → VPS port 80 (HTTP)
# Block ini harus PERTAMA agar jadi default_server sebelum block jalakarta.com.
# Cloudflare meneruskan header X-Forwarded-Proto: https — teruskan ke Next.js.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # match semua host yang tidak cocok server_name lain

    # Jangan intercept ACME challenge — biarkan Certbot kerja untuk jalakarta.com
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare set X-Forwarded-Proto: https — teruskan agar Next.js tahu HTTPS
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }
}

# Redirect HTTP → HTTPS (khusus jalakarta.com)
server {
    listen 80;
    listen [::]:80;
    server_name jalakarta.com *.jalakarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# App utama
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jalakarta.com *.jalakarta.com;

    ssl_certificate     /etc/letsencrypt/live/jalakarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jalakarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Upload limit (untuk file media)
    client_max_body_size 50M;

    # Proxy ke Next.js
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Next.js static files — cache aggressive
    location /_next/static/ {
        proxy_pass    http://localhost:3000/_next/static/;
        add_header    Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }
}

# MinIO public access (untuk gambar yang tampil di browser)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minio.jalakarta.com;

    ssl_certificate     /etc/letsencrypt/live/minio.jalakarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.jalakarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_request_buffering off;
    }
}
