# ── ikpmjogja.com ─────────────────────────────────────────────────────────────
# Redirect HTTP → HTTPS + www → apex
server {
    listen 80;
    listen [::]:80;
    server_name ikpmjogja.com www.ikpmjogja.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://ikpmjogja.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ikpmjogja.com www.ikpmjogja.com;

    ssl_certificate     /etc/letsencrypt/live/ikpmjogja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikpmjogja.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# MinIO public access (untuk gambar yang tampil di browser)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minio.jalakarta.com;

    ssl_certificate     /etc/letsencrypt/live/minio.jalakarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.jalakarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_request_buffering off;
    }
}
